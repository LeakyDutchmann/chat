[package]
name = "chat"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
colored = "3.1.1"
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9", features = ["mysql", "runtime-tokio", "macros", "chrono"] }
tokio = { version = "1.53", features = ["full"]}
urlencoding = "2.1.3"
