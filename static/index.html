<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Rocket Rooms</title>
    <link rel="stylesheet" href="/reset.css">
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" charset="utf-8" defer></script>
  </head>
  <body>
    <div id="auth">
        <h2>Login / Register</h2>
    
        <form id="auth-form">
            <input type="text" id="auth-username" placeholder="username" autocomplete="off">
            <input type="password" id="auth-password" placeholder="password" autocomplete="off">
            <input type="text" id="auth-color" placeholder="color (optional)" autocomplete="off">
    
            <button type="button" id="auth-login">Login</button>
            <button type="button" id="auth-register">Register</button>
        </form>
    
        <div id="auth-status"></div>
    </div>
        
    <main id="chat" style="display:none;">
      <div id="sidebar">
        <button id="logout-btn">Logout</button>
        <div id="status" class="pending"></div>

        <div id="room-list">
          <template id="room">
            <button class="room"></button>
          </template>
        </div>

        <form id="new-room">
          <input type="text" name="name" id="name" autocomplete="off"
              placeholder="new room..." maxlength="29"></input>
          <button type="submit">+</button>
        </form>
      </div>

      <div id="content">

        <div id="messages">
          <template id="message">
            <div class="message">
              <span class="username"></span>
              <span class="text"></span>
            </div>
          </template>
        </div>

        <form id="new-message">
          <input type="text" name="message" id="message" autocomplete="off"
              placeholder="Send a message..." autofocus>
          <button type="submit" id="send">Send</button>
        </form>
      </div>
    </main>
  </body>
</html>
